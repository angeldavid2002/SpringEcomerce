name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: ecomerce
          POSTGRES_USER: ecomerce
          POSTGRES_PASSWORD: ecomerce
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run the test suite
        env:
          DB_URL: jdbc:postgresql://localhost:5432/ecomerce
          DB_USER: ecomerce
          DB_PASS: ecomerce
          SEED_ENABLED: "false"
        run: ./mvnw -B test

  docker:
    name: Build the container image
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Validate the compose file
        env:
          JWT_SECRET: ci-secret-with-at-least-32-bytes!!
        run: docker compose config -q

      - name: Build the image
        run: docker build -t ecomerce:ci .
