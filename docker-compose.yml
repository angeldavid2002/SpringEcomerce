name: ecomerce

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-ecomerce}
      POSTGRES_USER: ${DB_USER:-ecomerce}
      POSTGRES_PASSWORD: ${DB_PASS:-ecomerce}
    ports:
      # 5433 on the host to avoid clashing with a local PostgreSQL on 5432.
      - "5433:5432"
    volumes:
      # PostgreSQL 18 moved its volume from /var/lib/postgresql/data to /var/lib/postgresql.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  app:
    build:
      context: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/${DB_NAME:-ecomerce}
      DB_USER: ${DB_USER:-ecomerce}
      DB_PASS: ${DB_PASS:-ecomerce}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env or the environment}
      JWT_ISSUER: ${JWT_ISSUER:-ecomerce}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-PT1H}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      BCRYPT_STRENGTH: ${BCRYPT_STRENGTH:-10}
      SEED_ENABLED: ${SEED_ENABLED:-false}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
      SEED_CUSTOMER_EMAIL: ${SEED_CUSTOMER_EMAIL:-}
      SEED_CUSTOMER_PASSWORD: ${SEED_CUSTOMER_PASSWORD:-}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/products || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

volumes:
  postgres-data:
