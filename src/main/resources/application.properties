spring.application.name=ecomerce

# Carga automática del archivo local .env (ignorado por git).
# El formato es KEY=VALUE, igual que un .properties. Si falta, se usan variables de entorno.
spring.config.import=optional:file:.env[.properties]

# Base de datos. Sin valores por defecto para credenciales: deben venir de .env o del entorno.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/ecomerce}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

springdoc.swagger-ui.path=/swagger

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Usuarios demo (solo desarrollo). Se crean al arrancar si no existen.
# Desactivar con SEED_ENABLED=false fuera de local.
app.seed.enabled=${SEED_ENABLED:false}
app.seed.admin-email=${SEED_ADMIN_EMAIL:}
app.seed.admin-password=${SEED_ADMIN_PASSWORD:}
app.seed.customer-email=${SEED_CUSTOMER_EMAIL:}
app.seed.customer-password=${SEED_CUSTOMER_PASSWORD:}

# JWT. El algoritmo y el secreto se configuran por entorno.
# JWT_SECRET es obligatorio y su longitud mínima depende del algoritmo (HS256=32, HS384=48, HS512=64 bytes).
app.jwt.secret=${JWT_SECRET:}
app.jwt.issuer=${JWT_ISSUER:ecomerce}
app.jwt.expiration=${JWT_EXPIRATION:PT1H}
app.jwt.algorithm=${JWT_ALGORITHM:HS256}

# Coste de BCrypt (rondas = 2^valor). Rango válido: 4 a 31.
app.security.bcrypt-strength=${BCRYPT_STRENGTH:10}
