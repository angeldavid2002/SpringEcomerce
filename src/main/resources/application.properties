spring.application.name=ecomerce

# Carga automática del archivo local .env (ignorado por git).
# El formato es KEY=VALUE, igual que un .properties. Si falta, se usan variables de entorno.
spring.config.import=optional:file:.env[.properties]

# Base de datos. Sin valores por defecto para credenciales: deben venir de .env o del entorno.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/ecomerce}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

springdoc.swagger-ui.path=/swagger

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Usuarios demo (solo desarrollo). Se crean al arrancar si no existen.
# Desactivar con SEED_ENABLED=false fuera de local.
app.seed.enabled=${SEED_ENABLED:false}
app.seed.admin-email=${SEED_ADMIN_EMAIL:}
app.seed.admin-password=${SEED_ADMIN_PASSWORD:}
app.seed.customer-email=${SEED_CUSTOMER_EMAIL:}
app.seed.customer-password=${SEED_CUSTOMER_PASSWORD:}

# JWT. El algoritmo y el secreto se configuran por entorno.
# JWT_SECRET es obligatorio y su longitud mínima depende del algoritmo (HS256=32, HS384=48, HS512=64 bytes).
app.jwt.secret=${JWT_SECRET:}
app.jwt.issuer=${JWT_ISSUER:ecomerce}
app.jwt.expiration=${JWT_EXPIRATION:PT1H}
app.jwt.algorithm=${JWT_ALGORITHM:HS256}

# Coste de BCrypt (rondas = 2^valor). Rango válido: 4 a 31.
app.security.bcrypt-strength=${BCRYPT_STRENGTH:10}

# Almacenamiento de imágenes (Backblaze B2, API compatible con S3).
# Con B2_ENABLED=false la API arranca igual y responde 503 al subir imágenes:
# así se puede levantar el proyecto sin bucket.
app.storage.b2.enabled=${B2_ENABLED:false}
app.storage.b2.endpoint=${B2_ENDPOINT:}
app.storage.b2.region=${B2_REGION:}
app.storage.b2.bucket=${B2_BUCKET:}
app.storage.b2.access-key=${B2_ACCESS_KEY:}
app.storage.b2.secret-key=${B2_SECRET_KEY:}
# Vida de la URL firmada que se devuelve al frontend (formato ISO-8601).
app.storage.b2.presign-expiration=${B2_PRESIGN_EXPIRATION:PT30M}
# Límite por imagen y tipos permitidos.
app.storage.b2.max-file-size=${B2_MAX_FILE_SIZE:5242880}
app.storage.b2.allowed-content-types=${B2_ALLOWED_CONTENT_TYPES:image/jpeg,image/png,image/webp,image/gif}
app.storage.b2.prefix=${B2_PREFIX:products}

# CORS para consumir el backend desde un frontend aparte (p. ej. React).
# Origen(es) permitido(s), separados por coma. Ajustar según el puerto del frontend
# (Create React App: 3000, Vite: 5173). Se puede sobrescribir con APP_CORS_* en .env.
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000}
app.cors.allowed-methods=${APP_CORS_ALLOWED_METHODS:GET,POST,PUT,PATCH,DELETE,OPTIONS}
app.cors.allowed-headers=${APP_CORS_ALLOWED_HEADERS:*}
app.cors.allow-credentials=${APP_CORS_ALLOW_CREDENTIALS:true}
app.cors.max-age=${APP_CORS_MAX_AGE:3600}
