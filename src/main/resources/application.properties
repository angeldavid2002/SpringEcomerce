spring.application.name=ecomerce

spring.datasource.url=jdbc:postgresql://localhost:5432/ecomerce
spring.datasource.username=${DB_USER:user}
spring.datasource.password=${DB_PASS:password}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

springdoc.swagger-ui.path=/swagger

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Usuarios demo (solo desarrollo). Se crean al arrancar si no existen.
# Desactivar con SEED_ENABLED=false fuera de local.
app.seed.enabled=${SEED_ENABLED:true}
app.seed.admin-email=${SEED_ADMIN_EMAIL:admin@example.com}
app.seed.admin-password=${SEED_ADMIN_PASSWORD:Admin1234!}
app.seed.customer-email=${SEED_CUSTOMER_EMAIL:customer@example.com}
app.seed.customer-password=${SEED_CUSTOMER_PASSWORD:Customer1234!}

# JWT firmado con HS256. JWT_SECRET es obligatorio (mínimo 32 bytes) y no tiene valor por defecto.
app.jwt.secret=${JWT_SECRET:}
app.jwt.issuer=${JWT_ISSUER:ecomerce}
app.jwt.expiration=${JWT_EXPIRATION:PT1H}
